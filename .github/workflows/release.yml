name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      # Build only; the release is created below, after the AppImage repack.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2

      # Ubuntu's bundled libwayland breaks EGL on hosts with newer Mesa
      # (blank window, "EGL_BAD_PARAMETER"). Current linuxdeploy excludes
      # libwayland, but tauri pins an older build that doesn't, so strip it
      # and repack. See tauri-apps/tauri#11994.
      - name: Repack AppImage without bundled libwayland
        run: |
          set -euo pipefail
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)
          dir=$(dirname "$appimage")
          name=$(basename "$appimage")
          cd "$dir"
          chmod +x "$name"
          ./"$name" --appimage-extract > /dev/null
          find squashfs-root -name 'libwayland-*.so*' -delete
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run --no-appstream squashfs-root "$name"
          rm -rf squashfs-root appimagetool

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "DockerLite $GITHUB_REF_NAME" \
            --verify-tag \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm
