name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # Build only; the release is created below, after the AppImage repack.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0

      # Ubuntu's bundled libwayland breaks EGL on hosts with newer Mesa
      # (blank window, "EGL_BAD_PARAMETER"). Current linuxdeploy excludes
      # libwayland, but tauri pins an older build that doesn't, so strip it
      # and repack. See tauri-apps/tauri#11994.
      - name: Repack AppImage without bundled libwayland
        run: |
          set -euo pipefail
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)
          dir=$(dirname "$appimage")
          name=$(basename "$appimage")
          cd "$dir"
          chmod +x "$name"
          ./"$name" --appimage-extract > /dev/null
          find squashfs-root -name 'libwayland-*.so*' -delete
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run --no-appstream squashfs-root "$name"
          rm -rf squashfs-root appimagetool

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "DockerLite $GITHUB_REF_NAME" \
            --verify-tag \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm
